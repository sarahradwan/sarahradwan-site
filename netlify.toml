# ── Build ─────────────────────────────────────────────────────────────────────
[build]
# The site is pre-compiled. Netlify deploys the dist/ folder directly.
command   = ""
publish   = "dist"
functions = "netlify/functions"

  [build.environment]
  NODE_VERSION = "20"

# ── Functions ─────────────────────────────────────────────────────────────────
[functions]
  [functions.emails]
  included_files = ["./emails/**"]

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options            = "SAMEORIGIN"
  X-Content-Type-Options     = "nosniff"
  Referrer-Policy            = "strict-origin-when-cross-origin"
  # frame-src must list every host embedded in an iframe — without it the
  # default-src 'self' fallback silently blocks the inline PDF viewer and all
  # YouTube/Vimeo project videos.
  Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://sarahradwan.me; connect-src 'self' https://res.cloudinary.com; frame-src 'self' https://res.cloudinary.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'self' https://res.cloudinary.com;"

# ── Caching ───────────────────────────────────────────────────────────────────
# Filenames under /assets/ carry a content hash, so a change always produces a
# new filename. They can therefore be cached forever, which removes a
# revalidation round trip from every repeat visit.
[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Photography and documents shipped with the site. Not hashed, so this is a
# month rather than forever: replacing an image means the new version is
# picked up within 30 days, or immediately under a new filename.
[[headers]]
for = "/media/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

# NOTE: the former /images/*, /cld-assets/* and /cdn-pdf/* rules were removed.
# Nothing referenced them: the React bundle contains no occurrence of any of
# the three. The /images/* rule additionally returned 401 because "fetch"
# delivery is not enabled on the Cloudinary account. Image optimisation now
# happens in netlify/functions/content.js, which rewrites Cloudinary URLs with
# f_auto,q_auto as the content is served.

# ── Legacy URL redirect ───────────────────────────────────────────────────────
[[redirects]]
from   = "/ai.html"
to     = "/ai"
status = 301

# ── SPA fallback ─────────────────────────────────────────────────────────────
[[redirects]]
from   = "/*"
to     = "/index.html"
status = 200

# ── Production context ────────────────────────────────────────────────────────
[context]
  [context.production]
    [context.production.functions]
      [context.production.functions.emails]
      included_files = ["./emails/**"]

  [context.master]
    [context.master.functions]
      [context.master.functions.emails]
      included_files = ["./emails/**"]
